apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-cloudflared
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Release.Name }}-cloudflared
  {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if and .Values.tailnet.enabled .Values.tailnet.advertiseRoutes }}
      initContainers:
        - name: enable-ip-forward
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
          command:
            - sh
            - -c
            - sysctl -w net.ipv4.ip_forward=1 && sysctl -w net.ipv6.conf.all.forwarding=1
      {{- end }}
      containers:
        - name: {{ printf "%s-%s" .Chart.Name "cloudflared"}}
          securityContext:
            {{- if and .Values.tailnet.enabled .Values.tailnet.advertiseRoutes }}
            {{- toYaml (merge .Values.securityContext (dict "capabilities" (dict "add" (list "NET_ADMIN" "NET_RAW")))) | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.securityContext | nindent 12 }}
            {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- else}}
          command:
            - bash
            - -c
          {{- end }}
          {{- if .Values.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- else}}
          args:
            - |
              cirond -c /etc/ciron/ciron.toml &
              CIRON_PID=$!
              trap 'kill -TERM "$CIRON_PID" 2>/dev/null' TERM INT
              {{- if .Values.tailnet.enabled }}
              until [ -S /run/tailscale/tailscaled.sock ]; do
                sleep 1
              done
              {{- if .Values.tailnet.advertiseRoutes }}
              tailscale --socket=/run/tailscale/tailscaled.sock up --login-server="$TAILNET_LOGIN_SERVER" --auth-key="$TAILNET_AUTH_KEY" --hostname="$TAILNET_HOSTNAME" --advertise-routes="$TAILNET_ADVERTISE_ROUTES"
              {{- else }}
              tailscale --socket=/run/tailscale/tailscaled.sock up --login-server="$TAILNET_LOGIN_SERVER" --auth-key="$TAILNET_AUTH_KEY" --hostname="$TAILNET_HOSTNAME"
              {{- end }}
              {{- end }}
              wait "$CIRON_PID"
          {{- end }}
          env:
            - name: TAILNET_LOGIN_SERVER
              value: {{ .Values.tailnet.loginServer }}
            - name: TAILNET_AUTH_KEY
              value: {{ .Values.tailnet.authKey }}
            - name: TAILNET_HOSTNAME
              value: {{ .Values.tailnet.hostName }}
            - name: TAILNET_STATE
              value: {{ .Values.tailnet.state }}
            {{- if .Values.tailnet.advertiseRoutes }}
            - name: TAILNET_ADVERTISE_ROUTES
              value: {{ join "," .Values.tailnet.advertiseRoutes | quote }}
            - name: TAILNET_TUN_MODE
              value: "tailscale0"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- end }}
          volumeMounts:
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            {{- if .Values.tailnet.enabled }}
            - name: tailnet-state
              mountPath: /var/lib/tailscale
              readOnly: false
            {{- end }}
            {{- if and .Values.tailnet.enabled .Values.tailnet.advertiseRoutes }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: creds
          secret:
            secretName: {{ .Release.Name }}-cloudflared
        - name: config
          configMap:
            name: {{ .Release.Name }}-cloudflared
            items:
            - key: config.yaml
              path: config.yaml
            - key: cert.pem
              path: cert.pem
        {{- if .Values.tailnet.enabled }}
        - name: tailnet-state
          emptyDir: {}
        {{- end }}
        {{- if and .Values.tailnet.enabled .Values.tailnet.advertiseRoutes }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
        {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}