# Ce workflow utilise des actions qui ne sont pas certifiées par GitHub.
# Elles sont fournies par un tiers et régies par
# des conditions d’utilisation du service, une politique de confidentialité et un support distincts.
# documentation en ligne.

# GitHub recommande d’épingler les actions à un SHA de commit.
# Pour obtenir une version plus récente, vous devez mettre à jour le SHA.
# Vous pouvez également référencer une balise ou une branche, mais l’action peut changer sans avertissement.

name: Publish amd64/arm64 to docker Hub

on:
  release:
    types: [published]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    name: Build and push multi-arch image to Docker Hub
    uses: sctg-development/build-multi-arch-docker-action/.github/workflows/build.yml@v1
    with:
      dockerfile: Dockerfile
      context: .
      image: highcanfly/net-tools
      tags: ${{ github.ref_name }}
      artifact-prefix: net-tools-${{ github.run_id }}
      cleanup: false
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
